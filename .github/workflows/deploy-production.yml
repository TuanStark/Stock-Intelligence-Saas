name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  # ─── 1. Lint Helm Chart ───────────────────────────────────────
  helm-lint:
    name: Helm Lint & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Lint Helm Chart
        run: |
          helm lint infra/k8s
          helm template test-release infra/k8s -f infra/k8s/values-prod.yaml > /dev/null
          echo "✅ Helm chart syntax and production templates validated successfully!"

  # ─── 2. Build & Push Docker Images ────────────────────────────
  build-and-push:
    name: Build & Push Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            file: infra/docker/Dockerfile.api
            context: .
            build-args: ""
          - service: web
            file: infra/docker/Dockerfile.web
            context: .
            build-args: ""
          - service: worker-ingestion
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=ingestion"
          - service: worker-processing
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=processing"
          - service: worker-ai
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=ai"
          - service: worker-payment
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=payment"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stock-intel-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/stock-intel-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Deploy to K3s Production via Helm ─────────────────────
  deploy-production:
    name: Deploy to K3s Production (Helm)
    needs: [helm-lint, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://chungkhoanai.dpdns.org

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to K3s Server
        uses: appleboy/ssh-action@v1.0.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          PAYOS_WEBHOOK_SECRET: ${{ secrets.PAYOS_WEBHOOK_SECRET }}
          SEPAY_WEBHOOK_SECRET: ${{ secrets.SEPAY_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: IMAGE_TAG,DOCKER_REGISTRY_USER,DATABASE_URL,REDIS_PASSWORD,JWT_SECRET,OPENAI_API_KEY,MARKET_DATA_API_KEY,PAYOS_WEBHOOK_SECRET,SEPAY_WEBHOOK_SECRET
          script: |
            set -e
            echo "==> Navigating to workspace on K3s node..."
            cd /app/stock-intelligence || cd $HOME/stock-intelligence
            git fetch origin main
            git reset --hard origin/main

            echo "==> Upgrading Helm release with --atomic..."
            helm upgrade --install stock-intel ./infra/k8s \
              -f ./infra/k8s/values-prod.yaml \
              --namespace stock-prod \
              --create-namespace \
              --set global.image.tag=${IMAGE_TAG} \
              --set global.image.registry="docker.io" \
              --set secrets.databaseUrl="${DATABASE_URL}" \
              --set secrets.redisPassword="${REDIS_PASSWORD}" \
              --set secrets.jwtSecret="${JWT_SECRET}" \
              --set secrets.openaiApiKey="${OPENAI_API_KEY}" \
              --set secrets.marketDataApiKey="${MARKET_DATA_API_KEY}" \
              --set secrets.payosWebhookSecret="${PAYOS_WEBHOOK_SECRET}" \
              --set secrets.sepayWebhookSecret="${SEPAY_WEBHOOK_SECRET}" \
              --atomic \
              --cleanup-on-fail \
              --timeout 8m

            echo "==> Verifying Rollout Status..."
            kubectl rollout status deployment/stock-intel-api -n stock-prod --timeout=120s
            kubectl rollout status deployment/stock-intel-web -n stock-prod --timeout=120s
            kubectl rollout status deployment/stock-intel-worker-processing -n stock-prod --timeout=120s
            
            echo "==> Listing Production Pods..."
            kubectl get pods -n stock-prod -o wide
            echo "🚀 Helm deployment to K3s Production completed successfully!"

      - name: Send Success Notification
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          payload=$(jq -n \
            --arg title "🚀 Stock Intelligence SaaS Deployed Successfully to K3s Production!" \
            --arg color "#2eb886" \
            --arg commit "${{ github.event.head_commit.message }}" \
            --arg author "${{ github.actor }}" \
            --arg sha "${{ github.sha }}" \
            --arg env "Production (K3s)" \
            --arg repo "${{ github.repository }}" \
            '{
              attachments: [{
                color: $color,
                title: $title,
                fields: [
                  { title: "Commit Message", value: $commit, short: false },
                  { title: "Author", value: $author, short: true },
                  { title: "Image Tag", value: $sha, short: true },
                  { title: "Environment", value: $env, short: true },
                  { title: "Repository", value: $repo, short: true }
                ]
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$payload" $SLACK_WEBHOOK_URL

      - name: Send Failure Notification
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          payload=$(jq -n \
            --arg title "❌ Production Deployment Failed (Auto-Rollback Triggered)!" \
            --arg color "#a30200" \
            --arg commit "${{ github.event.head_commit.message }}" \
            --arg author "${{ github.actor }}" \
            --arg env "Production (K3s)" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              attachments: [{
                color: $color,
                title: $title,
                fields: [
                  { title: "Commit Message", value: $commit, short: false },
                  { title: "Author", value: $author, short: true },
                  { title: "Environment", value: $env, short: true },
                  { title: "Check Run", value: $run_url, short: false }
                ]
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$payload" $SLACK_WEBHOOK_URL
