name: Deploy Production (GitOps & DevSecOps)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'gitops/**'
  workflow_dispatch:

# Đảm bảo các đợt deploy diễn ra tuần tự, tránh race-condition khi ghi GitOps
concurrency:
  group: production-delivery
  cancel-in-progress: false

permissions:
  contents: write
  security-events: write
  id-token: write

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  # ══════════════════════════════════════════════════════════════════
  # STAGE 1: HELM VALIDATION & MONOREPO CHANGE DETECTION
  # ══════════════════════════════════════════════════════════════════
  helm-lint:
    name: ⎈ Helm Lint & Template Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Lint Helm Chart & Test Render
        run: |
          helm lint gitops/chart
          helm template test-release gitops/chart -f gitops/envs/prod/values.yaml > /dev/null
          echo "✅ Helm chart syntax and production templates validated successfully!"

  # ══════════════════════════════════════════════════════════════════
  # STAGE 2: BUILD & PUSH MATRIX (SCOPED GHA CACHING)
  # ══════════════════════════════════════════════════════════════════
  build-and-push:
    name: 🐳 Build & Push ${{ matrix.service }}
    needs: [helm-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            file: infra/docker/Dockerfile.api
            context: .
            build-args: ""
          - service: web
            file: infra/docker/Dockerfile.web
            context: .
            build-args: ""
          - service: worker-ingestion
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=ingestion"
          - service: worker-processing
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=processing"
          - service: worker-ai
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=ai"
          - service: worker-payment
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=payment"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image (Scoped Cache)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stock-intel-${{ matrix.service }}:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/stock-intel-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ══════════════════════════════════════════════════════════════════
  # STAGE 3: DEDICATED CONTAINER SECURITY GATE (TÁCH BIỆT ĐỘC LẬP)
  # ══════════════════════════════════════════════════════════════════
  scan-images:
    name: 🛡️ Security Gate - ${{ matrix.service }}
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, worker-ingestion, worker-processing, worker-ai, worker-payment]

    steps:
      - name: 🛡️ Trivy Scan & Export SARIF
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/stock-intel-${{ matrix.service }}:sha-${{ github.sha }}"
          format: "sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"

      - name: 📤 Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-${{ matrix.service }}.sarif"
          category: "trivy-${{ matrix.service }}"

      - name: 🛡️ Verify Security Quality Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/stock-intel-${{ matrix.service }}:sha-${{ github.sha }}"
          format: "table"
          exit-code: "1"          # Block pipeline if CRITICAL patchable CVE found
          ignore-unfixed: true    # Skip CVEs with no upstream fix yet
          severity: "CRITICAL"

  # ══════════════════════════════════════════════════════════════════
  # STAGE 4: GITOPS PROMOTION (WRITE-BACK TO GIT & NOTIFY)
  # ══════════════════════════════════════════════════════════════════
  gitops-promote:
    name: 🚀 GitOps Promote to ArgoCD
    needs: [scan-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq (for surgical YAML editing)
        run: |
          YQ_VERSION="v4.44.3"
          wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Image Tag in Production Helm Values
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Use yq to surgically update ONLY global.image.tag
          # (sed would overwrite ALL `tag:` lines including stateful image tags)
          yq e '.global.image.tag = "sha-${{ github.sha }}"' -i gitops/envs/prod/values.yaml

          git add gitops/envs/prod/values.yaml

          # Check if there are changes before committing
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(gitops): promote production images to sha-${{ github.sha }} [skip ci]"
            git push origin main
            echo "🚀 New image tag pushed to Git repository for ArgoCD sync!"
          fi

      - name: Post Execution Summary to GitHub UI
        if: always()
        run: |
          echo "### 🚀 Production Delivery Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitOps Target:** \`gitops/envs/prod/values.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Gate:** ✅ Trivy SARIF Scanned & Uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- **Sync Engine:** ArgoCD (Automated Prune & Self-Heal)" >> $GITHUB_STEP_SUMMARY

      - name: Send Slack Success Notification
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          payload=$(jq -n \
            --arg title "🚀 GitOps Promotion Triggered for ArgoCD!" \
            --arg color "#2eb886" \
            --arg commit "${{ github.event.head_commit.message }}" \
            --arg author "${{ github.actor }}" \
            --arg sha "sha-${{ github.sha }}" \
            --arg env "Production (ArgoCD)" \
            --arg repo "${{ github.repository }}" \
            '{
              attachments: [{
                color: $color,
                title: $title,
                fields: [
                  { title: "Commit Message", value: $commit, short: false },
                  { title: "Author", value: $author, short: true },
                  { title: "Image Tag", value: $sha, short: true },
                  { title: "Sync Engine", value: "ArgoCD", short: true },
                  { title: "Security Gate", value: "✅ Passed (Zero CVE)", short: true },
                  { title: "Repository", value: $repo, short: true }
                ]
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$payload" $SLACK_WEBHOOK_URL

      - name: Send Slack Failure Notification
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          payload=$(jq -n \
            --arg title "❌ GitOps Promotion Failed!" \
            --arg color "#a30200" \
            --arg commit "${{ github.event.head_commit.message }}" \
            --arg author "${{ github.actor }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              attachments: [{
                color: $color,
                title: $title,
                fields: [
                  { title: "Commit Message", value: $commit, short: false },
                  { title: "Author", value: $author, short: true },
                  { title: "Check Run", value: $run_url, short: false }
                ]
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$payload" $SLACK_WEBHOOK_URL
