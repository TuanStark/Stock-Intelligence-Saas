name: Deploy Production (GitOps)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'infra/k8s/argocd/**'
      - 'infra/k8s/values-prod.yaml'

permissions:
  contents: write
  id-token: write

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  # ─── 1. Lint Helm Chart ───────────────────────────────────────
  helm-lint:
    name: Helm Lint & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Lint Helm Chart
        run: |
          helm lint infra/k8s
          helm template test-release infra/k8s -f infra/k8s/values-prod.yaml > /dev/null
          echo "✅ Helm chart syntax and production templates validated successfully!"

  # ─── 2. Build & Push Docker Images ────────────────────────────
  build-and-push:
    name: Build & Push Matrix
    needs: [helm-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            file: infra/docker/Dockerfile.api
            context: .
            build-args: ""
          - service: web
            file: infra/docker/Dockerfile.web
            context: .
            build-args: ""
          - service: worker-ingestion
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=ingestion"
          - service: worker-processing
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=processing"
          - service: worker-ai
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=ai"
          - service: worker-payment
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=payment"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stock-intel-${{ matrix.service }}:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/stock-intel-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛡️ Trivy Container Image Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/stock-intel-${{ matrix.service }}:sha-${{ github.sha }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  # ─── 3. GitOps Promotion (Write-Back to Git) ───────────────────
  gitops-promote:
    name: GitOps Promote to ArgoCD
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update Image Tag in Production Helm Values
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Replace tag in values-prod.yaml with new sha tag
          sed -i 's/tag: .*/tag: "sha-'${{ github.sha }}'"/' infra/k8s/values-prod.yaml
          
          git add infra/k8s/values-prod.yaml
          
          # Check if there are changes before committing
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(gitops): promote production image to sha-${{ github.sha }} [skip ci]"
            git push origin main
            echo "🚀 New image tag pushed to Git repository for ArgoCD sync!"
          fi

      - name: Send Success Notification
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          payload=$(jq -n \
            --arg title "🚀 GitOps Promotion Triggered for ArgoCD!" \
            --arg color "#2eb886" \
            --arg commit "${{ github.event.head_commit.message }}" \
            --arg author "${{ github.actor }}" \
            --arg sha "sha-${{ github.sha }}" \
            --arg env "Production (ArgoCD)" \
            --arg repo "${{ github.repository }}" \
            '{
              attachments: [{
                color: $color,
                title: $title,
                fields: [
                  { title: "Commit Message", value: $commit, short: false },
                  { title: "Author", value: $author, short: true },
                  { title: "Image Tag", value: $sha, short: true },
                  { title: "Sync Engine", value: "ArgoCD", short: true },
                  { title: "Repository", value: $repo, short: true }
                ]
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$payload" $SLACK_WEBHOOK_URL

      - name: Send Failure Notification
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          payload=$(jq -n \
            --arg title "❌ GitOps Promotion Failed!" \
            --arg color "#a30200" \
            --arg commit "${{ github.event.head_commit.message }}" \
            --arg author "${{ github.actor }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              attachments: [{
                color: $color,
                title: $title,
                fields: [
                  { title: "Commit Message", value: $commit, short: false },
                  { title: "Author", value: $author, short: true },
                  { title: "Check Run", value: $run_url, short: false }
                ]
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$payload" $SLACK_WEBHOOK_URL
