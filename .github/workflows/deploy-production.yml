name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  AWS_ROLE_TO_ASSUME: "" # Specify AWS IAM OIDC Role ARN here for passwordless auth (Optional)
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build-and-push:
    name: Build & Push Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            file: infra/docker/Dockerfile.api
            context: .
            build-args: ""
          - service: web
            file: infra/docker/Dockerfile.web
            context: .
            build-args: ""
          - service: worker-ingestion
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=ingestion"
          - service: worker-processing
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=processing"
          - service: worker-ai
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=ai"
          - service: worker-payment
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=payment"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/stock-intel-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/stock-intel-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

