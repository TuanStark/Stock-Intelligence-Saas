name: Deploy Production

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run All Tests
        run: pnpm turbo test

      - name: Build All
        run: pnpm turbo build

      # Build Docker images
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        run: |
          docker build -f infra/docker/Dockerfile.api \
            -t $REGISTRY/stock-intel-api:${{ github.sha }} \
            -t $REGISTRY/stock-intel-api:${{ github.ref_name }} \
            -t $REGISTRY/stock-intel-api:latest .
          docker push $REGISTRY/stock-intel-api --all-tags

      - name: Build & Push Web Image
        run: |
          docker build -f infra/docker/Dockerfile.web \
            -t $REGISTRY/stock-intel-web:${{ github.sha }} \
            -t $REGISTRY/stock-intel-web:${{ github.ref_name }} \
            -t $REGISTRY/stock-intel-web:latest .
          docker push $REGISTRY/stock-intel-web --all-tags

      - name: Build & Push Worker Images
        run: |
          for worker in ingestion processing ai; do
            docker build -f infra/docker/Dockerfile.worker \
              --build-arg WORKER=$worker \
              -t $REGISTRY/stock-intel-worker-$worker:${{ github.sha }} \
              -t $REGISTRY/stock-intel-worker-$worker:${{ github.ref_name }} \
              -t $REGISTRY/stock-intel-worker-$worker:latest .
            docker push $REGISTRY/stock-intel-worker-$worker --all-tags
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://stockintel.com

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Migration
      - name: Run Migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm --filter @stock-intel/db exec prisma migrate deploy

      # Rolling deploy
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to Production
        run: |
          kubectl set image deployment/api \
            api=$REGISTRY/stock-intel-api:${{ github.sha }} \
            --namespace=stock-prod
          kubectl rollout status deployment/api \
            --namespace=stock-prod --timeout=300s

          kubectl set image deployment/web \
            web=$REGISTRY/stock-intel-web:${{ github.sha }} \
            --namespace=stock-prod
          kubectl rollout status deployment/web \
            --namespace=stock-prod --timeout=300s

          for worker in ingestion processing ai; do
            kubectl set image deployment/worker-$worker \
              worker=$REGISTRY/stock-intel-worker-$worker:${{ github.sha }} \
              --namespace=stock-prod
            kubectl rollout status deployment/worker-$worker \
              --namespace=stock-prod --timeout=300s
          done

      # Post-deploy verification
      - name: Production Smoke Test
        run: |
          sleep 15
          curl -f https://api.stockintel.com/api/v1/health || exit 1

      - name: Monitor Error Rate (2 min)
        run: |
          echo "Monitoring for 2 minutes post-deploy..."
          sleep 120
          echo "✅ No alerts triggered — deploy stable"
