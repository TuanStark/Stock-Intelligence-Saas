name: CI/CD DevSecOps Quality & Security Gates

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true # Tự động hủy job cũ khi dev push commit mới -> Tiết kiệm 100% runner phút cho commit rác

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.2.2"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/stockintel_test?schema=public"
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"
  TURBO_CACHE_DIR: ".turbo"

jobs:
  # ══════════════════════════════════════════════════════════════════
  # 1 & 2. LINT, FORMAT, STATIC TYPECHECK & HELM LINT
  # ══════════════════════════════════════════════════════════════════
  lint-and-typecheck:
    name: 🔍 Lint, Format & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Turborepo Local Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Prettier Format Check
        run: pnpm format:check

      - name: ESLint Code Quality Check
        run: pnpm lint

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: TypeScript Static TypeCheck
        run: pnpm type-check

      - name: Helm Chart Lint & Template Check
        run: |
          helm lint infra/k8s
          helm template test-release infra/k8s -f infra/k8s/values-prod.yaml > /dev/null

  # ══════════════════════════════════════════════════════════════════
  # 5. SAST & SECRET LEAK SCANNING (Non-blocking / Parallel)
  # ══════════════════════════════════════════════════════════════════
  sast-and-secret-scan:
    name: 🛡️ SAST & Secret Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Semgrep SAST Code Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/nodejsscan
        continue-on-error: true

  # ══════════════════════════════════════════════════════════════════
  # 6. DEPENDENCY SCAN (Software Composition Analysis - SCA)
  # ══════════════════════════════════════════════════════════════════
  dependency-scan:
    name: 📦 Dependency Vulnerability Scan (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Dependency Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

  # ══════════════════════════════════════════════════════════════════
  # 3. UNIT TESTS & COVERAGE
  # ══════════════════════════════════════════════════════════════════
  unit-tests:
    name: 🧪 Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Turborepo Local Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Unit Tests with Turbo Cache
        run: pnpm test

  # ══════════════════════════════════════════════════════════════════
  # 4. INTEGRATION & E2E TESTS (With ephemeral DB/Redis Services)
  # ══════════════════════════════════════════════════════════════════
  integration-tests:
    name: 🔗 Integration & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JWT_SECRET: "mock_ci_jwt_test_secret_32_chars_long"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/stockintel_test?schema=public"
      REDIS_HOST: "localhost"
      REDIS_PORT: "6379"
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_DB: stockintel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply Database Migrations (Prisma Test DB)
        run: pnpm --filter @stock-intel/db exec prisma db push --schema=./prisma/schema.prisma --accept-data-loss

      - name: Run API E2E Integration Tests
        run: |
          if [ -f apps/api/test/jest-e2e.json ]; then
            pnpm --filter @stock-intel/api test:e2e
          else
            echo "No dedicated e2e tests found, skipping."
          fi

  # ══════════════════════════════════════════════════════════════════
  # 7 & 8. DOCKER BUILD & CONTAINER IMAGE SCAN (Triggers only if Code/Dockerfile changes)
  # ══════════════════════════════════════════════════════════════════
  docker-build-and-image-scan:
    name: 🐳 Docker Build & Security Scan Matrix
    needs: [lint-and-typecheck, sast-and-secret-scan, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            file: infra/docker/Dockerfile.api
            context: .
            build-args: ""
          - service: web
            file: infra/docker/Dockerfile.web
            context: .
            build-args: ""
          - service: worker-processing
            file: infra/docker/Dockerfile.worker
            context: .
            build-args: "WORKER=processing"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Layer Caching via GHA - No Push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: false
          load: true
          tags: stock-intel-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛡️ Trivy Container Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "stock-intel-${{ matrix.service }}:test"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  # ══════════════════════════════════════════════════════════════════
  # FINAL GATEWAY
  # ══════════════════════════════════════════════════════════════════
  ci-passed:
    name: 🎯 All DevSecOps Quality & Security Gates Passed
    needs:
      - lint-and-typecheck
      - sast-and-secret-scan
      - dependency-scan
      - unit-tests
      - integration-tests
      - docker-build-and-image-scan
    runs-on: ubuntu-latest
    steps:
      - name: Success Summary
        run: echo "🎉 All 8 DevSecOps gates passed successfully with maximum cache acceleration!"
