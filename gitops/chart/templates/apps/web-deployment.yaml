{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stock-intel.fullname" . }}-web
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "stock-intel.selectorLabels" (dict "context" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stock-intel.labels" . | nindent 8 }}
        {{- include "stock-intel.selectorLabels" (dict "context" . "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.web.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - web
                topologyKey: "kubernetes.io/hostname"
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "stock-intel.selectorLabels" (dict "context" . "component" "web") | nindent 14 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: {{ include "stock-intel.image" (dict "global" .Values.global.image "component" .Values.web.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "stock-intel.configMapName" . }}
            - secretRef:
                name: {{ include "stock-intel.secretName" . }}
          env:
            - name: PORT
              value: "{{ .Values.web.service.port }}"
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.config.apiUrl | quote }}
          {{- if .Values.web.probes.startup }}
          startupProbe:
            {{- toYaml .Values.web.probes.startup | nindent 12 }}
          {{- end }}
          {{- if .Values.web.probes.liveness }}
          livenessProbe:
            {{- toYaml .Values.web.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if .Values.web.probes.readiness }}
          readinessProbe:
            {{- toYaml .Values.web.probes.readiness | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            {{- with .Values.web.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stock-intel.fullname" . }}-web
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "stock-intel.selectorLabels" (dict "context" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: {{ .Values.web.service.port }}
      protocol: TCP
{{- if .Values.web.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "stock-intel.fullname" . }}-web-pdb
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "stock-intel.selectorLabels" (dict "context" . "component" "web") | nindent 6 }}
{{- end }}
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "stock-intel.fullname" . }}-web-hpa
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "stock-intel.fullname" . }}-web
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.web.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.web.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
