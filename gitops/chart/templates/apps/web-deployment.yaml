{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stock-intel.fullname" . }}-web
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "stock-intel.selectorLabels" (dict "context" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stock-intel.labels" . | nindent 8 }}
        {{- include "stock-intel.selectorLabels" (dict "context" . "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.web.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - web
                topologyKey: "kubernetes.io/hostname"
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: {{ include "stock-intel.image" (dict "global" .Values.global.image "component" .Values.web.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            - -e
            - |
              const fs = require("fs");
              const path = require("path");
              function replaceInDir(dir) {
                if (!fs.existsSync(dir)) return;
                const files = fs.readdirSync(dir);
                for (const file of files) {
                  const fullPath = path.join(dir, file);
                  const stat = fs.statSync(fullPath);
                  if (stat.isDirectory()) {
                    replaceInDir(fullPath);
                  } else if (file.endsWith(".js") || file.endsWith(".json") || file.endsWith(".html")) {
                    let content = fs.readFileSync(fullPath, "utf8");
                    let original = content;
                    content = content.replace(/([a-zA-Z0-9_$]+)\.default\.env\.NEXT_PUBLIC_API_URL/g, "($1.default.env.NEXT_PUBLIC_API_URL||\"https://chungkhoanai.dpdns.org/api/v1\")");
                    content = content.replace(/([a-zA-Z0-9_$]+)\.env\.NEXT_PUBLIC_API_URL/g, "($1.env.NEXT_PUBLIC_API_URL||\"https://chungkhoanai.dpdns.org/api/v1\")");
                    content = content.replace(/process\.env\.NEXT_PUBLIC_API_URL/g, "\"https://chungkhoanai.dpdns.org/api/v1\"");
                    content = content.replace("let t=await (0,tf.getSession)();", "let t=await Promise.race([(0,tf.getSession)(),new Promise(r=>setTimeout(()=>r(null),300))]);");
                    content = content.replaceAll("timeout:1e4", "timeout:3e4");
                    content = content.replaceAll("timeout: 10000", "timeout: 30000");
                    content = content.replaceAll("http://localhost:3001", "https://chungkhoanai.dpdns.org");
                    content = content.replaceAll("ws://localhost:3001", "wss://chungkhoanai.dpdns.org");
                    if (content !== original) {
                      fs.writeFileSync(fullPath, content, "utf8");
                    }
                  }
                }
              }
              try {
                replaceInDir("/app/apps/web/.next");
                console.log("🚀 Next.js client bundles deep patched successfully with non-blocking session & 30s timeout!");
              } catch (e) {
                console.error("Patching error:", e);
              }
              require("/app/apps/web/server.js");
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "stock-intel.configMapName" . }}
            - secretRef:
                name: {{ include "stock-intel.secretName" . }}
          env:
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.config.apiUrl | quote }}
          {{- if .Values.web.startupProbe }}
          startupProbe:
            {{- toYaml .Values.web.probes.startup | nindent 12 }}
          {{- end }}
          {{- if .Values.web.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.web.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if .Values.web.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.web.probes.readiness | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- with .Values.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stock-intel.fullname" . }}-web
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "stock-intel.selectorLabels" (dict "context" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: 3000
      protocol: TCP
{{- if .Values.web.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "stock-intel.fullname" . }}-web-pdb
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "stock-intel.selectorLabels" (dict "context" . "component" "web") | nindent 6 }}
{{- end }}
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "stock-intel.fullname" . }}-web-hpa
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "stock-intel.fullname" . }}-web
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.web.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.web.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
