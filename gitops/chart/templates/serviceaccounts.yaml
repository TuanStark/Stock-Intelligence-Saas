# ─── ServiceAccounts — Zero-Trust IAM ─────────────────────────────────────
# One ServiceAccount per component with automountServiceAccountToken: false.
# Pods in this deployment do NOT need to call the Kubernetes API.
# If any future component requires K8s API access, create a dedicated Role/
# RoleBinding and set automountServiceAccountToken: true only for that SA.

# ── API ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stock-intel.serviceAccountName.api" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
automountServiceAccountToken: false

---
# ── Web ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stock-intel.serviceAccountName.web" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
automountServiceAccountToken: false

---
# ── Workers (shared SA for all worker types) ──────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stock-intel.serviceAccountName.worker" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
automountServiceAccountToken: false
