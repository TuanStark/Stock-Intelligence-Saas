{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stock-intel.secretName" . }}
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ── Database ──────────────────────────────────────────────────────────
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  # ── Redis ─────────────────────────────────────────────────────────────
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  # ── JWT ───────────────────────────────────────────────────────────────
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  # ── NextAuth ──────────────────────────────────────────────────────────
  NEXTAUTH_SECRET: {{ .Values.secrets.nextauthSecret | quote }}
  # ── Google OAuth ──────────────────────────────────────────────────────
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  # ── AI ────────────────────────────────────────────────────────────────
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  # ── Market Data ───────────────────────────────────────────────────────
  MARKET_DATA_API_KEY: {{ .Values.secrets.marketDataApiKey | quote }}
  # ── MinIO ─────────────────────────────────────────────────────────────
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioSecretKey | quote }}
  # ── API Request Signing & Encryption ─────────────────────────────────
  API_SIGN_SECRET: {{ .Values.secrets.apiSignSecret | quote }}
  API_ENCRYPTION_KEY: {{ .Values.secrets.apiEncryptionKey | quote }}
  NEXT_PUBLIC_API_SIGN_SECRET: {{ .Values.secrets.apiSignSecret | quote }}
  NEXT_PUBLIC_API_ENCRYPTION_KEY: {{ .Values.secrets.apiEncryptionKey | quote }}
  # ── Payment Gateway Webhooks ──────────────────────────────────────────
  PAYOS_WEBHOOK_SECRET: {{ .Values.secrets.payosWebhookSecret | quote }}
  SEPAY_WEBHOOK_SECRET: {{ .Values.secrets.sepayWebhookSecret | quote }}
  # ── Payment Bank Config ───────────────────────────────────────────────
  PAYMENT_BANK_ID: {{ .Values.secrets.paymentBankId | quote }}
  PAYMENT_BANK_ACCOUNT: {{ .Values.secrets.paymentBankAccount | quote }}
  PAYMENT_BANK_NAME: {{ .Values.secrets.paymentBankName | quote }}
{{- end }}
