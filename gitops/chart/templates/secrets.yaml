{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stock-intel.secretName" . }}
  labels:
    {{- include "stock-intel.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  MARKET_DATA_API_KEY: {{ .Values.secrets.marketDataApiKey | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  PAYOS_WEBHOOK_SECRET: {{ .Values.secrets.payosWebhookSecret | quote }}
  SEPAY_WEBHOOK_SECRET: {{ .Values.secrets.sepayWebhookSecret | quote }}
{{- end }}
