apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stock-intel-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: stock-intel-production
    app.kubernetes.io/part-of: stock-intelligence
    environment: production
spec:
  project: default
  source:
    repoURL: 'https://github.com/TuanStark/Stock-Intelligence-Saas.git'
    targetRevision: main
    path: gitops/chart
    helm:
      valueFiles:
        - ../envs/prod/values.yaml
  destination:
    # Set to your K3s cluster server URL as registered in ArgoCD (e.g., https://192.168.1.100:6443 or in-cluster)
    name: k3s-production
    namespace: stock-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
