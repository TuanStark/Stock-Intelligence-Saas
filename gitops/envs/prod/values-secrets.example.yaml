secrets:
  # ── Database ──────────────────────────────────────────────────────────
  databaseUrl: "postgresql://postgres:YOUR_STRONG_DB_PASSWORD@stock-intel-postgres:5432/stockintel?schema=public"
  postgresPassword: "YOUR_STRONG_DB_PASSWORD"   # Must match password in databaseUrl above
  # ── Redis ─────────────────────────────────────────────────────────────
  redisPassword: "YOUR_STRONG_REDIS_PASSWORD"
  # ── JWT ───────────────────────────────────────────────────────────────
  jwtSecret: "YOUR_PRODUCTION_JWT_SECRET_AT_LEAST_32_CHARACTERS"
  # ── NextAuth ──────────────────────────────────────────────────────────
  nextauthSecret: "YOUR_NEXTAUTH_SECRET_AT_LEAST_32_CHARACTERS"
  # ── Google OAuth (https://console.cloud.google.com) ───────────────────
  googleClientId: "your-google-client-id.apps.googleusercontent.com"
  googleClientSecret: "GOCSPX-your-google-client-secret"
  # ── AI ────────────────────────────────────────────────────────────────
  openaiApiKey: "sk-proj-..."
  # ── Market Data ───────────────────────────────────────────────────────
  marketDataApiKey: "your-market-data-api-key"
  # ── MinIO ─────────────────────────────────────────────────────────────
  minioAccessKey: "production_minio_admin"
  minioSecretKey: "YOUR_STRONG_MINIO_PASSWORD"
  # ── API Request Signing & Encryption (must match BE config) ──────────
  apiSignSecret: "YOUR_PRODUCTION_API_SIGN_SECRET_MIN_32_CHARS"
  apiEncryptionKey: "YOUR_PRODUCTION_API_ENCRYPTION_KEY_MIN_32_CHARS"
  # ── Payment Gateways ──────────────────────────────────────────────────
  payosWebhookSecret: "your-payos-webhook-secret"
  sepayWebhookSecret: "your-sepay-webhook-secret"
  # ── Payment Bank ──────────────────────────────────────────────────────
  paymentBankId: "vcb"                    # e.g. mb, vietinbank, vcb, acb
  paymentBankAccount: "your-account-number"
  paymentBankName: "YOUR FULL NAME"

stateful:
  postgres:
    postgresPassword: "YOUR_STRONG_DB_PASSWORD"
  redis:
    redisPassword: "YOUR_STRONG_REDIS_PASSWORD"
  minio:
    rootPassword: "YOUR_STRONG_MINIO_PASSWORD"
