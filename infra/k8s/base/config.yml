apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-intel-config
  labels:
    app: stock-intel
data:
  NODE_ENV: "production"
  PORT: "3001"
  WEB_URL: "https://stockintel.com"
  API_URL: "https://api.stockintel.com"
  REDIS_PORT: "6379"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
---
apiVersion: v1
kind: Secret
metadata:
  name: stock-intel-secrets
  labels:
    app: stock-intel
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_AT_DEPLOY_TIME"
  REDIS_HOST: "REPLACE_AT_DEPLOY_TIME"
  REDIS_PASSWORD: "REPLACE_AT_DEPLOY_TIME"
  JWT_SECRET: "REPLACE_AT_DEPLOY_TIME"
  OPENAI_API_KEY: "REPLACE_AT_DEPLOY_TIME"
  MARKET_DATA_API_KEY: "REPLACE_AT_DEPLOY_TIME"
  MINIO_ACCESS_KEY: "REPLACE_AT_DEPLOY_TIME"
  MINIO_SECRET_KEY: "REPLACE_AT_DEPLOY_TIME"
