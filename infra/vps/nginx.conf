# ─── Stock Intelligence SaaS — VPS Nginx Reverse Proxy Config ───
# Path on VPS: /etc/nginx/sites-available/stockintel.conf
# Enable: ln -s /etc/nginx/sites-available/stockintel.conf /etc/nginx/sites-enabled/

# Global Proxy Settings
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_cache_bypass $http_upgrade;

# Disable exposing Nginx version
server_tokens off;

# Max upload size
client_max_body_size 50M;

# ─── Default Fallback Server (Hardening Security) ──────────────
# Drop requests from scanners, bots, or direct IP access
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444; # Connection closed without response
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 1. DEVELOPMENT ENVIRONMENT (dev.stockintel.vn)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Dev Web App (HTTP -> HTTPS Redirect)
server {
    listen 80;
    listen [::]:80;
    server_name dev.stockintel.vn; # Replace with your actual domain

    location / {
        return 301 https://$host$request_uri;
    }
}

# Dev Web App (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.stockintel.vn; # Replace with your actual domain

    # SSL Config (managed by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/dev.stockintel.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev.stockintel.vn/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000; # Dev Next.js Web
    }
}

# Dev API Server (HTTP -> HTTPS Redirect)
server {
    listen 80;
    listen [::]:80;
    server_name dev-api.stockintel.vn; # Replace with your actual domain

    location / {
        return 301 https://$host$request_uri;
    }
}

# Dev API Server (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev-api.stockintel.vn; # Replace with your actual domain

    # SSL Config
    # ssl_certificate /etc/letsencrypt/live/dev-api.stockintel.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev-api.stockintel.vn/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001; # Dev NestJS API
    }
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
